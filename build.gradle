// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.0'
        classpath 'com.google.devtools.ksp:symbol-processing-gradle-plugin:2.2.0-2.0.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

ext {
    supportDependencies = [
            appcompat : 'androidx.appcompat:appcompat:1.7.0',
            recyclerview : 'androidx.recyclerview:recyclerview:1.3.2',
            cardview: 'androidx.cardview:cardview:1.0.0',
            annotations : 'androidx.annotation:annotation:1.8.2',
            design : 'com.google.android.material:material:1.12.0',
            preference: 'androidx.preference:preference:1.2.1',
            constraintlayout : 'androidx.constraintlayout:constraintlayout:2.1.4',
            core : 'androidx.core:core:1.13.1',
            localbroadcast : 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0',
            loader : 'androidx.loader:loader:1.1.0',
            legacy : 'androidx.legacy:legacy-support-v4:1.0.0',
            biometric : 'androidx.biometric:biometric:1.1.0'
    ]
    googlePlayServices = [
            auth: "com.google.android.gms:play-services-auth:15.0.1",
            signin: "com.google.android.gms:play-services-identity:15.0.1",
            location: "com.google.android.gms:play-services-location:15.0.1",
            places: "com.google.android.gms:play-services-places:15.0.1",
            drive: "com.google.android.gms:play-services-drive:15.0.1"
    ]
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
