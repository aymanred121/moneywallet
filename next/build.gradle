apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace "com.oriondev.moneywallet.next"
    compileSdk 35
    defaultConfig {
        applicationId "com.oriondev.moneywallet.next"
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName "6.4.0"
        vectorDrawables.useSupportLibrary = true
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
    signingConfigs {
        release {
            // next/signing.properties (git-ignored) keeps the same key across builds so every
            // version installs over the previous one instead of showing up as a new app
            def props = new Properties()
            def file = rootProject.file('next/signing.properties')
            if (file.exists()) {
                file.withInputStream { props.load(it) }
                storeFile rootProject.file("next/" + props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file('next/signing.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // same application id as release: install one app and update it in place
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }
    lint {
        abortOnError false
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all { it.systemProperty 'robolectric.logging', 'stdout' }
        }
    }
    sourceSets {
        // MigrationTestHelper reads the exported schemas as assets; Robolectric unit tests see
        // the tested variant's merged assets, so they ride along in debug builds only (~20 KB)
        debug.assets.srcDirs += files("$projectDir/schemas")
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/*.kotlin_module']
        }
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
    arg("room.generateKotlin", "true")
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.08.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2'
    implementation 'androidx.navigation:navigation-compose:2.9.3'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.work:work-runtime-ktx:2.10.3'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.glance:glance-appwidget:1.1.1'
    implementation 'androidx.glance:glance-material3:1.1.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'

    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    ksp 'androidx.room:room-compiler:2.7.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // charts
    implementation 'com.patrykandpatrick.vico:compose-m3:2.1.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core-ktx:1.6.1'
    testImplementation 'androidx.test.ext:junit-ktx:1.2.1'
    testImplementation 'androidx.room:room-testing:2.7.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
