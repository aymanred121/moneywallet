name: Android CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - name: Check release tag
        if: env.IS_TAG == 'true'
        run: |
          # releases must be release-signed, so they install as updates over the existing app
          if [ "$HAS_SIGNING" != "true" ]; then
            echo "::error::Release tags need the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets."
            exit 1
          fi
          version=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' next/build.gradle | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in next/build.gradle."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :next:testDebugUnitTest --stacktrace

      - name: Restore signing key
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p next/signing
          echo "$KEYSTORE_BASE64" | base64 --decode > next/signing/release.jks
          {
            echo "storeFile=signing/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > next/signing.properties

      - name: Build release APK (signed)
        if: env.HAS_SIGNING == 'true'
        run: |
          ./gradlew :next:assembleRelease
          mkdir -p dist
          cp next/build/outputs/apk/release/next-release.apk "dist/moneywallet-next-${GITHUB_REF_NAME//\//-}.apk"

      - name: Verify signature
        if: env.HAS_SIGNING == 'true'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs dist/*.apk | tee signature.txt
          # an unsigned or debug-signed build must never be released
          if grep -qi "CN=Android Debug" signature.txt; then echo "::error::APK is debug-signed"; exit 1; fi
          echo "### Signing certificate" >> "$GITHUB_STEP_SUMMARY"
          grep -i "SHA-256 digest" signature.txt | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK (no signing secrets, e.g. pull requests from forks)
        if: env.HAS_SIGNING != 'true'
        run: |
          ./gradlew :next:assembleDebug
          mkdir -p dist
          cp next/build/outputs/apk/debug/next-debug.apk "dist/moneywallet-next-${GITHUB_REF_NAME//\//-}-debug.apk"

      - name: Remove signing material
        if: always()
        run: rm -f next/signing/release.jks next/signing.properties

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: moneywallet-next
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: next/build/reports/tests/

      - name: Publish release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
